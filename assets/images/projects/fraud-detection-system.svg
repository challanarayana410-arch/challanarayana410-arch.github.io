<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<title>PN-07 FraudShield architecture</title>
<desc>Blueprint schematic: a React dashboard connects to a Node.js/Express backend (transaction API, WebSocket, rule engine). The backend fans out to MongoDB, a Redis cache and a Python ML service running XGBoost and Isolation Forest.</desc>
<defs>
<pattern id="mn" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#EAF3FB" stroke-opacity="0.05" stroke-width="1"/></pattern>
<pattern id="mj" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#EAF3FB" stroke-opacity="0.09" stroke-width="1"/></pattern>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#EAF3FB" fill-opacity="0.8"/></marker>
<marker id="k" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9FDBFF"/></marker>
<style>
text{font-family:"IBM Plex Mono",SFMono-Regular,Consolas,monospace;font-size:9px;letter-spacing:0.06em;fill:#EAF3FB;text-transform:uppercase}
.s{fill-opacity:0.7}
.t{font-size:10px}
.b{fill:#0D3B66;fill-opacity:0.92;stroke:#EAF3FB;stroke-opacity:0.7;stroke-width:1}
.c{fill:none;stroke:#EAF3FB;stroke-opacity:0.5;stroke-width:1;stroke-dasharray:4 3}
.l{fill:none;stroke:#EAF3FB;stroke-opacity:0.8;stroke-width:1}
.k{fill:none;stroke:#9FDBFF;stroke-width:1}
.n{font-size:11px;fill:#9FDBFF;font-weight:bold}
</style>
</defs>
