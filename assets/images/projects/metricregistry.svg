<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<title>PN-01 metricregistry architecture</title>
<desc>Blueprint schematic: fixtures load into in-memory SQLite; the Registry and SQLite feed evaluate(), which fans out to check_divergence() and definition_changes(); lineage_of() reads the Registry; all three outputs feed the demo report.</desc>
<defs>
<pattern id="mn" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#EAF3FB" stroke-opacity="0.05" stroke-width="1"/></pattern>
<pattern id="mj" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#EAF3FB" stroke-opacity="0.09" stroke-width="1"/></pattern>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#EAF3FB" fill-opacity="0.8"/></marker>
<marker id="k" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9FDBFF"/></marker>
<style>
text{font-family:"IBM Plex Mono",SFMono-Regular,Consolas,monospace;font-size:10px;letter-spacing:0.06em;fill:#EAF3FB;text-transform:uppercase}
.s{font-size:9px;fill-opacity:0.7}
.v{font-size:11px;fill:#9FDBFF}
.b{fill:none;stroke:#EAF3FB;stroke-opacity:0.7;stroke-width:1}
.l{fill:none;stroke:#EAF3FB;stroke-opacity:0.6;stroke-width:1}
.k{fill:none;stroke:#9FDBFF;stroke-width:1}
</style>
</defs>
<rect width="640" height="360" fill="#0D3B66"/>
<rect width="640" height="360" fill="url(#mn)"/>
<rect width="640" height="360" fill="url(#mj)"/>
<rect x="16" y="16" width="608" height="20" class="b"/>
<text x="24" y="30">PN-01 · METRICREGISTRY · VERSIONED KPI DEFINITIONS + DIVERGENCE MONITOR</text>

<rect x="16" y="48" width="132" height="42" class="b"/>
<text x="24" y="66">FIXTURES.PY</text><text x="24" y="80" class="s">STUDENT COHORT</text>

<path d="M16 114V150A66 7 0 0 0 148 150V114" class="b"/>
<ellipse cx="82" cy="114" rx="66" ry="7" class="b"/>
<text x="24" y="134">SQLITE</text><text x="24" y="146" class="s">IN-MEMORY</text>

<rect x="16" y="232" width="132" height="44" class="k"/>
<text x="24" y="250">REGISTRY</text><text x="24" y="264" class="s">VERSIONED DEFS</text>

<rect x="196" y="150" width="100" height="64" class="k"/>
<text x="204" y="178">EVALUATE()</text><text x="204" y="193" class="s">RUNS DEF SQL</text>

<rect x="352" y="84" width="136" height="44" class="k"/>
<text x="360" y="104">CHECK_DIVERGENCE()</text><text x="360" y="118" class="s">PAIRWISE BY SUBJECT</text>

<rect x="352" y="160" width="136" height="44" class="b"/>
<text x="360" y="180">DEFINITION_CHANGES()</text><text x="360" y="194" class="s">OLD VS NEW VERSION</text>

<rect x="352" y="242" width="136" height="44" class="b"/>
<text x="360" y="262">LINEAGE_OF()</text><text x="360" y="276" class="s">COLUMNS READ</text>

<rect x="536" y="150" width="88" height="64" class="k"/>
<text x="544" y="178">DEMO.PY</text><text x="544" y="193" class="s">REPORT</text>

<line x1="82" y1="90" x2="82" y2="106" class="l" marker-end="url(#a)"/>
<polyline points="148,134 172,134 172,166 196,166" class="l" marker-end="url(#a)"/>
<polyline points="148,244 172,244 172,198 196,198" class="k" marker-end="url(#k)"/>
<line x1="148" y1="264" x2="352" y2="264" class="l" marker-end="url(#a)"/>
<line x1="296" y1="182" x2="352" y2="182" class="l" marker-end="url(#a)"/>
<polyline points="324,182 324,106 352,106" class="k" marker-end="url(#k)"/>
<polyline points="488,106 512,106 512,166 536,166" class="k" marker-end="url(#k)"/>
<line x1="488" y1="182" x2="536" y2="182" class="l" marker-end="url(#a)"/>
<polyline points="488,264 512,264 512,198 536,198" class="l" marker-end="url(#a)"/>

<rect x="16" y="304" width="160" height="40" class="b"/>
<text x="24" y="320" class="s">DEFAULT TOLERANCE</text><text x="24" y="336" class="v">0.5%</text>
<rect x="192" y="304" width="160" height="40" class="b"/>
<text x="200" y="320" class="s">MKTG VS REGISTRAR GAP</text><text x="200" y="336" class="v">6.80%</text>
<rect x="368" y="304" width="160" height="40" class="b"/>
<text x="376" y="320" class="s">TESTS</text><text x="376" y="336" class="v">16</text>

<line x1="540" y1="326" x2="564" y2="326" class="k" marker-end="url(#k)"/>
<text x="572" y="329" class="s">KEY PATH</text>
</svg>