<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img">
<title>PN-09 TalentFlow architecture</title>
<desc>React and TypeScript frontend calls REST into a Node.js and Express backend with an API server, a BullMQ queue worker and an AI service, over PostgreSQL, Redis and S3.</desc>
<defs>
<pattern id="mn" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#EAF3FB" stroke-opacity="0.05" stroke-width="1"/></pattern>
<pattern id="mj" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#EAF3FB" stroke-opacity="0.09" stroke-width="1"/></pattern>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#EAF3FB" fill-opacity="0.8"/></marker>
<marker id="k" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9FDBFF"/></marker>
<style>
text{font-family:"IBM Plex Mono",SFMono-Regular,Consolas,monospace;letter-spacing:0.06em;text-transform:uppercase;fill:#EAF3FB;font-size:9px}
.t{font-size:10px}
.s{fill-opacity:0.7}
.k{fill:#9FDBFF}
.n{font-size:14px;fill:#9FDBFF}
.b{fill:none;stroke:#EAF3FB;stroke-opacity:0.6;stroke-width:1}
.c{fill:none;stroke:#EAF3FB;stroke-opacity:0.4;stroke-width:1;stroke-dasharray:4 3}
.h{fill:none;stroke:#9FDBFF;stroke-width:1}
.l{fill:none;stroke:#EAF3FB;stroke-opacity:0.8;stroke-width:1}
</style>
</defs>
