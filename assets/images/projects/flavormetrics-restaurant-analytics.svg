<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img">
<title>PN-06 FlavorMetrics system architecture</title>
<desc>React and TypeScript frontend connects over REST and WebSocket to a Node.js/Express backend containing an API server, a Python ML service and POS integration. The backend feeds five analytics modules. Demand forecast yields 7-day cover predictions.</desc>
