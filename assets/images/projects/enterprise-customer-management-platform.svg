<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img">
<title>PN-02 Enterprise Customer Management Platform: system architecture</title>
<desc>Request path from a React 18 SPA through an axios client and nginx reverse proxy into a Spring Boot 3.3 API (JWT filter, controllers, services, Caffeine cache, Spring Data JPA) and on to MySQL 8, whose schema is owned by Flyway. Readouts: 4 roles, 9 SQL statements per dashboard, 60-second cache.</desc>
<defs>
<pattern id="mn" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#EAF3FB" stroke-opacity="0.05" stroke-width="1"/></pattern>
<pattern id="mj" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#EAF3FB" stroke-opacity="0.09" stroke-width="1"/></pattern>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#EAF3FB" fill-opacity="0.8"/></marker>
<marker id="k" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9FDBFF"/></marker>
<style>
text{font-family:"IBM Plex Mono",SFMono-Regular,Consolas,monospace;fill:#EAF3FB;letter-spacing:0.06em;text-transform:uppercase;font-size:10px}
.s{font-size:9px;fill-opacity:0.7}
.t{text-anchor:middle}
.b{fill:#0D3B66;stroke:#EAF3FB;stroke-opacity:0.6;stroke-width:1}
.kb{fill:#0D3B66;stroke:#9FDBFF;stroke-opacity:0.9;stroke-width:1}
.r{fill:#0D3B66;stroke:#9FDBFF;stroke-width:1}
.n{fill:#9FDBFF;font-size:11px}
.l{fill:none;stroke:#EAF3FB;stroke-opacity:0.7;stroke-width:1}
.kl{fill:none;stroke:#9FDBFF;stroke-width:1}
</style>
</defs>
<rect width="640" height="360" fill="#0D3B66"/>
<rect width="640" height="360" fill="url(#mn)"/>
<rect width="640" height="360" fill="url(#mj)"/>

<rect x="16" y="16" width="608" height="20" class="b"/>
<text x="26" y="30">PN-02 · Enterprise Customer Management Platform · System Architecture</text>

<rect x="16" y="50" width="130" height="48" class="kb"/>
<text x="81" y="70" class="t">React 18 SPA</text>
<text x="81" y="84" class="t s">TypeScript</text>
