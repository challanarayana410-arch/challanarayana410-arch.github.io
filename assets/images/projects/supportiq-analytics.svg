<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img">
<title>PN-04 SupportIQ Analytics system architecture</title>
<desc>React client talks to a Node.js/Express server over REST and Socket.io. The server uses PostgreSQL via Prisma and a Redis cache, and calls a Python FastAPI ML service for sentiment, categorization and forecasting. The 7-day volume forecast is the key output.</desc>
