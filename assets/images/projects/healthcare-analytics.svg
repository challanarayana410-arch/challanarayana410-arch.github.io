<text x="537" y="226" text-anchor="middle">ML models</text>
<text x="537" y="240" text-anchor="middle" class="s">Random Forest</text>
<text x="537" y="253" text-anchor="middle" class="s">SHAP explainer</text>

<line x1="80" y1="164" x2="122" y2="164" class="m" marker-end="url(#am)"/>
<line x1="244" y1="164" x2="288" y2="164" class="m" marker-end="url(#am)"/>
<text x="266" y="156" text-anchor="middle" class="s">REST</text>
<line x1="410" y1="164" x2="440" y2="164" class="m"/>
<line x1="440" y1="98" x2="440" y2="234" class="l"/>
<line x1="440" y1="98" x2="468" y2="98" class="l" marker-end="url(#ar)"/>
<line x1="440" y1="164" x2="468" y2="164" class="l" marker-end="url(#ar)"/>
<line x1="440" y1="234" x2="468" y2="234" class="m" marker-end="url(#am)"/>

<rect x="104" y="292" width="160" height="40" class="b"/>
